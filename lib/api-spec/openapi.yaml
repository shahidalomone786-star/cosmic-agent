openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Provider-backed AI operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/models:
    get:
      operationId: listAiModels
      tags: [ai]
      summary: List enabled AI models
      description: Returns the approved model registry without provider credentials.
      responses:
        "200":
          description: Enabled model registry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiModel"
  /ai/chat:
    post:
      operationId: sendAiMessage
      tags: [ai]
      summary: Send a message to an approved AI model
      description: Sends a conversation to the server-side provider layer. Provider credentials are never accepted from or returned to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "400":
          description: Invalid request or unapproved model
        "429":
          description: Provider rate limit
        "503":
          description: Provider unavailable or not configured
  /ai/chat/stream:
    post:
      operationId: streamAiMessage
      tags: [ai]
      summary: Stream a response from an approved AI model
      description: Streams server-side provider output as server-sent events. Provider credentials are never accepted from or returned to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: Server-sent response stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request or unapproved model
        "429":
          description: Provider rate limit
        "503":
          description: Provider unavailable or not configured
  /ai/change-proposal:
    post:
      operationId: createChangeProposal
      tags: [ai]
      summary: Generate a validated proposal-only code change
      description: Generates a bounded, validated diff preview. It never writes to GitHub, commits, pushes, deletes, or executes commands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeProposalInput"
      responses:
        "200":
          description: Validated code change proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeProposal"
        "400":
          description: Invalid request, insufficient context, malformed model response, or invalid patch
        "403":
          description: Protected file or repository permission error
        "404":
          description: File not found
        "429":
          description: GitHub or provider rate limit
        "422":
          description: Binary, oversized, or non-applying change
        "503":
          description: Provider or repository unavailable
  /ai/change-proposal/execute:
    post:
      operationId: executeChangeProposal
      tags: [ai]
      summary: Apply an approved proposal locally and validate it
      description: Applies only a server-held proposal after explicit approval. Never commits or pushes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteChangeProposalInput"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeExecutionResult"
        "400":
          description: Invalid or already handled proposal
        "409":
          description: File changed since proposal generation
        "403":
          description: Protected file or unsafe path
        "422":
          description: Invalid patch or validation failure
  /ai/change-proposal/undo:
    post:
      operationId: undoChangeProposal
      tags: [ai]
      summary: Undo a previously applied local proposal
      description: Restores the exact server-held pre-apply snapshot. Never commits or pushes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalActionInput"
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalActionResult"
        "400":
          description: Invalid or unavailable proposal
  /ai/change-proposal/commit-review:
    post:
      operationId: getChangeProposalCommitReview
      tags: [ai]
      summary: Review a validated local change before commit approval
      description: Returns a server-verified commit review. No GitHub write occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalActionInput"
      responses:
        "200":
          description: Commit review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitReview"
        "400":
          description: Proposal has not passed local validation
        "409":
          description: Validated files changed after local validation
  /ai/change-proposal/commit:
    post:
      operationId: commitChangeProposal
      tags: [ai]
      summary: Commit an approved validated local change
      description: Requires explicit commit approval. The configured GitHub provider performs no operation until enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitChangeProposalInput"
      responses:
        "200":
          description: Commit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResult"
        "400":
          description: Invalid proposal or commit message
        "403":
          description: Protected file rejected
        "409":
          description: Repository or branch conflict
        "503":
          description: GITHUB_PROVIDER_NOT_CONFIGURED
  /ai/change-proposal/push-review:
    post:
      operationId: getChangeProposalPushReview
      tags: [ai]
      summary: Review a created commit before push approval
      description: Returns a server-held commit for explicit push confirmation. No push occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalActionInput"
      responses:
        "200":
          description: Push review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushReview"
        "400":
          description: No approved commit exists
  /ai/change-proposal/push:
    post:
      operationId: pushChangeProposal
      tags: [ai]
      summary: Push an approved commit without force
      description: Requires explicit push approval. The configured GitHub provider compares remote HEAD and never force-pushes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalActionInput"
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
        "400":
          description: No approved commit exists
        "409":
          description: Remote branch changed
        "503":
          description: GITHUB_PROVIDER_NOT_CONFIGURED
  /repository/connect:
    post:
      operationId: connectRepository
      tags: [repository]
      summary: Connect a read-only GitHub repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryConnectInput"
      responses:
        "200":
          description: Repository metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryRef"
        "400":
          description: Invalid repository URL
        "403":
          description: Repository requires authorization
  /repository/tree:
    post:
      operationId: listRepositoryTree
      tags: [repository]
      summary: List one directory from a connected repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryTreeInput"
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepositoryEntry"
  /repository/file:
    post:
      operationId: readRepositoryFile
      tags: [repository]
      summary: Read a protected text file from a repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryFileInput"
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryFile"
  /repository/search:
    post:
      operationId: searchRepository
      tags: [repository]
      summary: Search readable repository source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositorySearchInput"
      responses:
        "200":
          description: Search matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepositorySearchResult"
  /repository/overview:
    post:
      operationId: getRepositoryOverview
      tags: [repository]
      summary: Get a cached read-only repository intelligence overview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryTreeInput"
      responses:
        "200":
          description: Repository structure, classifications, and dependency relationships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryOverview"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiModel:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        provider:
          type: string
        capabilities:
          type: array
          items:
            type: string
        contextWindow:
          type: [number, "null"]
        enabled:
          type: boolean
        recommended:
          type: boolean
      required:
        - id
        - displayName
        - provider
        - capabilities
        - contextWindow
        - enabled
        - recommended
    AiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
      required:
        - role
        - content
    AiChatInput:
      type: object
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AiChatMessage"
        temperature:
          type: [number, "null"]
          minimum: 0
          maximum: 2
        repositoryContext:
          type: object
          properties:
            repository:
              $ref: "#/components/schemas/RepositoryRef"
            paths:
              type: array
              items: { type: string }
          required: [repository, paths]
      required:
        - model
        - messages
    AiChatResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        content:
          type: string
        provider:
          type: string
        repositoryContext:
          $ref: "#/components/schemas/RepositoryContextUsed"
      required:
        - id
        - model
        - content
        - provider
    ChangeProposalInput:
      type: object
      properties:
        model:
          type: string
          minLength: 1
        request:
          type: string
          minLength: 1
        repositoryContext:
          type: object
          properties:
            repository:
              $ref: "#/components/schemas/RepositoryRef"
            paths:
              type: array
              items: { type: string }
          required: [repository, paths]
      required: [model, request, repositoryContext]
    ChangeProposalFile:
      type: object
      properties:
        path: { type: string }
        language: { type: string }
        originalCode: { type: string }
        proposedCode: { type: string }
        diff: { type: string }
        explanation: { type: string }
        addedLines: { type: number }
        removedLines: { type: number }
      required: [path, language, originalCode, proposedCode, diff, explanation, addedLines, removedLines]
    ChangeProposal:
      type: object
      properties:
        status:
          type: string
          enum: [proposal]
        summary: { type: string }
        explanation: { type: string }
        risk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChangeProposalFile"
        affectedFiles:
          type: array
          items: { type: string }
        addedLines: { type: number }
        removedLines: { type: number }
        proposalId: { type: string }
      required: [status, summary, explanation, risk, files, affectedFiles, addedLines, removedLines, proposalId]
    ExecuteChangeProposalInput:
      type: object
      properties:
        proposalId: { type: string, minLength: 1 }
      required: [proposalId]
    ProposalActionInput:
      type: object
      properties:
        proposalId: { type: string, minLength: 1 }
      required: [proposalId]
    ChangeExecutionResult:
      type: object
      properties:
        status:
          type: string
          enum: [applied, validation_failed]
        proposalId: { type: string }
        files: { type: array, items: { type: string } }
        addedLines: { type: number }
        removedLines: { type: number }
        typecheck: { type: string }
        build: { type: string }
        message: { type: string }
        canUndo: { type: boolean }
      required: [status, proposalId, files, addedLines, removedLines, typecheck, build, message, canUndo]
    ProposalActionResult:
      type: object
      properties:
        status:
          type: string
          enum: [undone]
        proposalId: { type: string }
        message: { type: string }
      required: [status, proposalId, message]
    CommitReview:
      type: object
      properties:
        status: { type: string, enum: [ready_to_commit] }
        proposalId: { type: string }
        repository: { $ref: "#/components/schemas/RepositoryRef" }
        branch: { type: string }
        files: { type: array, items: { type: string } }
        addedLines: { type: number }
        removedLines: { type: number }
        diffSummary: { type: string }
        validation: { type: string, enum: [passed] }
      required: [status, proposalId, repository, branch, files, addedLines, removedLines, diffSummary, validation]
    CommitChangeProposalInput:
      type: object
      properties:
        proposalId: { type: string, minLength: 1 }
        message: { type: string, minLength: 1, maxLength: 200 }
      required: [proposalId, message]
    CommitResult:
      type: object
      properties:
        status: { type: string, enum: [committed] }
        proposalId: { type: string }
        repository: { $ref: "#/components/schemas/RepositoryRef" }
        branch: { type: string }
        commitSha: { type: string }
        shortSha: { type: string }
      required: [status, proposalId, repository, branch, commitSha, shortSha]
    PushReview:
      type: object
      properties:
        status: { type: string, enum: [ready_to_push] }
        proposalId: { type: string }
        repository: { $ref: "#/components/schemas/RepositoryRef" }
        branch: { type: string }
        commitSha: { type: string }
        shortSha: { type: string }
      required: [status, proposalId, repository, branch, commitSha, shortSha]
    PushResult:
      type: object
      properties:
        status: { type: string, enum: [pushed] }
        proposalId: { type: string }
        repository: { $ref: "#/components/schemas/RepositoryRef" }
        branch: { type: string }
        commitSha: { type: string }
        shortSha: { type: string }
      required: [status, proposalId, repository, branch, commitSha, shortSha]
    RepositoryContextUsed:
      type: object
      properties:
        paths:
          type: array
          items: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              startLine: { type: number }
              endLine: { type: number }
            required: [path]
      required: [paths, sources]
    RepositoryConnectInput:
      type: object
      properties:
        repositoryUrl:
          type: string
        branch:
          type: string
      required: [repositoryUrl]
    RepositoryRef:
      type: object
      properties:
        id: { type: string }
        owner: { type: string }
        name: { type: string }
        branch: { type: string }
        defaultBranch: { type: string }
        webUrl: { type: string }
      required: [id, owner, name, branch, defaultBranch, webUrl]
    RepositoryEntry:
      type: object
      properties:
        path: { type: string }
        name: { type: string }
        type: { type: string, enum: [file, directory] }
        size: { type: number }
        language: { type: string }
      required: [path, name, type]
    RepositoryTreeInput:
      type: object
      properties:
        repository: { $ref: "#/components/schemas/RepositoryRef" }
        path: { type: string }
      required: [repository]
    RepositoryFileInput:
      type: object
      properties:
        repository: { $ref: "#/components/schemas/RepositoryRef" }
        path: { type: string }
      required: [repository, path]
    RepositoryFile:
      type: object
      properties:
        path: { type: string }
        language: { type: string }
        size: { type: number }
        content: { type: string }
        truncated: { type: boolean }
      required: [path, language, size, content, truncated]
    RepositorySearchInput:
      type: object
      properties:
        repository: { $ref: "#/components/schemas/RepositoryRef" }
        query: { type: string }
      required: [repository, query]
    RepositorySearchResult:
      type: object
      properties:
        path: { type: string }
        line: { type: number }
        context: { type: string }
      required: [path, line, context]
    RepositoryOverview:
      type: object
      properties:
        repository:
          $ref: "#/components/schemas/RepositoryRef"
        fileCount: { type: number }
        sourceCount: { type: number }
        configCount: { type: number }
        testCount: { type: number }
        framework: { type: string }
        language: { type: string }
        packageManager: { type: string }
        directories:
          type: array
          items: { type: string }
        entryPoints:
          type: array
          items: { type: string }
        authenticationFiles:
          type: array
          items: { type: string }
        apiFiles:
          type: array
          items: { type: string }
        databaseFiles:
          type: array
          items: { type: string }
        files:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              category: { type: string }
              language: { type: string }
              size: { type: number }
            required: [path, category, language]
        dependencies:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
            required: [from, to]
        architecture:
          type: array
          items:
            type: object
            properties:
              layer: { type: string }
              paths:
                type: array
                items: { type: string }
            required: [layer, paths]
      required:
        - repository
        - fileCount
        - sourceCount
        - configCount
        - testCount
        - framework
        - language
        - packageManager
        - directories
        - entryPoints
        - authenticationFiles
        - apiFiles
        - databaseFiles
        - files
        - dependencies
        - architecture

